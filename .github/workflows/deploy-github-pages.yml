name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    # Deploy-key pushes trigger push events. The collector already deploys its exact
    # validated commit through workflow_call; do not start a competing Pages run.
    paths-ignore:
      - 'public/migrations/**'
      - 'artemis'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact report commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  # Replace an obsolete deployment, including one stuck before a runner starts.
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
  deploy:
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prevent stale deployment
        id: freshness
        env:
          EXPECTED_COMMIT: ${{ inputs.ref || github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote --exit-code "$REPOSITORY_URL" "refs/heads/$DEFAULT_BRANCH")
          read -r current_commit current_ref <<< "$remote_head"
          if [[ ! "$current_commit" =~ ^[a-f0-9]{40}$ || "$current_ref" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Could not validate the default-branch revision" >&2
            exit 1
          fi
          if [[ "$EXPECTED_COMMIT" == "$current_commit" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped stale deployment of $EXPECTED_COMMIT: $DEFAULT_BRANCH is now $current_commit. A newer push or the next collection run will deploy the current revision." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.freshness.outputs.current == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.freshness.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - if: steps.freshness.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - if: steps.freshness.outputs.current == 'true'
        run: npm ci
      - name: Verify the published report and its snapshot files
        if: steps.freshness.outputs.current == 'true'
        run: npx tsx report/ui/verify-deployment.ts
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}
