name: UI Migration Reports

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [artemis-updated]

permissions:
  contents: read

concurrency:
  group: migration-reports
  cancel-in-progress: false

jobs:
  generate-report:
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Update pinned Artemis revision
        run: |
          git -C artemis fetch origin develop
          git -C artemis checkout --detach origin/develop
      - run: npm run typecheck:report
      - run: npm run report:ui
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish validated reports
        id: publish
        env:
          REPORT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add artemis public/migrations
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh UI migration evidence"
            git push origin "HEAD:$REPORT_BRANCH"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: generate-report
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-github-pages.yml
    with:
      ref: ${{ needs.generate-report.outputs.commit }}
