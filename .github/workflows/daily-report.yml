name: UI Migration Reports

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migration-reports
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          # PAT commits trigger the Pages workflow, unlike GITHUB_TOKEN commits.
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Update pinned Artemis revision
        run: |
          git -C artemis fetch origin develop
          git -C artemis checkout --detach origin/develop
      - run: npm run typecheck:report
      - run: npm run report:ui
      - run: npm test
      - run: npm run build
      - name: Publish validated reports
        env:
          REPORT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add artemis public/migrations
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh UI migration evidence"
          git push origin "HEAD:$REPORT_BRANCH"
