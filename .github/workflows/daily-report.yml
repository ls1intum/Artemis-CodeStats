name: Migration Reports

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [artemis-updated]

permissions:
  contents: read

concurrency:
  group: migration-reports
  cancel-in-progress: false

jobs:
  generate-report:
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Update pinned Artemis revision
        id: artemis
        run: |
          git -C artemis fetch origin develop
          git -C artemis checkout --detach origin/develop
          echo "commit=$(git -C artemis rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck:report
      - run: npm run report:ui -- --ref "${{ steps.artemis.outputs.commit }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run report:openapi -- --ref "${{ steps.artemis.outputs.commit }}"
      - name: Validate history and reproduce OpenAPI evidence before publication
        run: npm run report:openapi:verify -- --ref "${{ steps.artemis.outputs.commit }}"
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish validated reports
        id: publish
        env:
          REPORT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add artemis public/migrations public/openapi
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh migration evidence"
            git push origin "HEAD:$REPORT_BRANCH"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: generate-report
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-github-pages.yml
    with:
      ref: ${{ needs.generate-report.outputs.commit }}

  # A failing collection must not go unnoticed: one open issue tracks it, with a comment per
  # failed run, and the next successful run closes it.
  alert:
    needs: [generate-report, deploy]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: UI migration collection is failing
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ needs.generate-report.result == 'failure' || needs.deploy.result == 'failure' }}
    steps:
      - name: Open, update or close the tracking issue
        run: |
          issue=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ "$FAILED" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Still failing: $RUN"
            else
              gh issue create --title "$TITLE" --body "The hourly UI/OpenAPI migration collection or deployment failed and the dashboards may no longer be updated. First failing run: $RUN. Read the failed step's log; the issue closes itself after the next successful run."
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Recovered: $RUN"
          fi
