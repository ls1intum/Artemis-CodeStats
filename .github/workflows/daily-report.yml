name: Migration Reports

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [artemis-updated]

permissions:
  contents: read

jobs:
  generate-report:
    # A waiting Pages deployment must never hold the collector's lock.
    concurrency:
      group: migration-reports
      cancel-in-progress: false
    # The SSH credential is gated to main by the report-publisher environment.
    environment: report-publisher
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
      ui: ${{ steps.collect.outputs.ui }}
      openapi: ${{ steps.collect.outputs.openapi }}
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - continue-on-error: true
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Update pinned Artemis revision
        id: artemis
        run: |
          git -C artemis fetch origin develop
          git -C artemis checkout --detach origin/develop
          echo "commit=$(git -C artemis rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Collect and validate each dashboard independently
        id: collect
        run: npx tsx report/collect-reports.ts "${{ steps.artemis.outputs.commit }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Keep the previous pin if neither report could advance
        if: steps.collect.outputs.ui != 'success' && steps.collect.outputs.openapi != 'success'
        run: git -C artemis checkout --detach "$(git rev-parse HEAD:artemis)"
      - name: Publish validated reports
        id: publish
        env:
          REPORT_BRANCH: ${{ github.event.repository.default_branch }}
          REPORT_PUBLISH_KEY: ${{ secrets.REPORT_PUBLISH_KEY }}
        run: bash .github/scripts/publish-reports.sh

  deploy:
    needs: generate-report
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-github-pages.yml
    with:
      ref: ${{ needs.generate-report.outputs.commit }}
      report-only: true

  # Report partial failure without preventing the successful dashboard's deployment.
  collection-result:
    needs: [generate-report, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mark a degraded collection as failed
        env:
          UI_RESULT: ${{ needs.generate-report.outputs.ui }}
          OPENAPI_RESULT: ${{ needs.generate-report.outputs.openapi }}
        run: |
          echo "UI collection: $UI_RESULT; OpenAPI collection: $OPENAPI_RESULT"
          test "$UI_RESULT" = success && test "$OPENAPI_RESULT" = success

  # A failing collection must not go unnoticed: one open issue tracks it, with a comment per
  # failed run, and the next successful run closes it.
  alert:
    needs: [generate-report, deploy, collection-result]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: UI migration collection is failing
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ needs.generate-report.result != 'success' || needs.deploy.result != 'success' || needs['collection-result'].result != 'success' }}
    steps:
      - name: Open, update or close the tracking issue
        run: |
          issue=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ "$FAILED" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Still failing: $RUN"
            else
              gh issue create --title "$TITLE" --body "The hourly UI/OpenAPI migration collection or deployment failed and the dashboards may no longer be updated. First failing run: $RUN. Read the failed step's log; the issue closes itself after the next successful run."
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Recovered: $RUN"
          fi
